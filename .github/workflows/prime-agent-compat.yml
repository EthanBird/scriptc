name: Prime Agent compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - agent/prime-compat-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prime-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout scriptc
        uses: actions/checkout@v4

      - name: Checkout Prime Agent oracle
        uses: actions/checkout@v4
        with:
          repository: EthanBird/prime-agent
          ref: main
          path: .compat/prime-agent

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install scriptc
        run: pnpm install --frozen-lockfile

      - name: Build scriptc
        run: pnpm build

      - name: Install Prime Agent
        working-directory: .compat/prime-agent
        run: npm ci

      - name: Build Prime Agent workspace baseline
        working-directory: .compat/prime-agent
        run: npm run build

      - name: ScriptC coverage of Prime Agent CLI
        working-directory: .compat/prime-agent
        run: |
          set +e
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" \
            coverage packages/coding-agent/src/cli-main.ts \
            --dynamic 2>&1 | tee "$RUNNER_TEMP/prime-coverage.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/prime-coverage.status"
          exit 0

      - name: ScriptC build of Prime Agent CLI
        working-directory: .compat/prime-agent
        run: |
          set +e
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" \
            build packages/coding-agent/src/cli-main.ts \
            --dynamic \
            -o "$RUNNER_TEMP/prime-agent-scriptc" 2>&1 | tee "$RUNNER_TEMP/prime-build.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/prime-build.status"
          exit 0

      - name: Smoke-test compiled Prime Agent
        working-directory: .compat/prime-agent
        run: |
          set +e
          build_status=$(cat "$RUNNER_TEMP/prime-build.status")
          if [ "$build_status" -eq 0 ] && [ -x "$RUNNER_TEMP/prime-agent-scriptc" ]; then
            timeout 20s "$RUNNER_TEMP/prime-agent-scriptc" --help > "$RUNNER_TEMP/prime-smoke.log" 2>&1
            status=$?
          else
            status=125
            echo "ScriptC build did not produce an executable; smoke test skipped." > "$RUNNER_TEMP/prime-smoke.log"
          fi
          echo "$status" > "$RUNNER_TEMP/prime-smoke.status"
          cat "$RUNNER_TEMP/prime-smoke.log"
          exit 0

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-agent-scriptc-diagnostics
          path: |
            ${{ runner.temp }}/prime-coverage.log
            ${{ runner.temp }}/prime-coverage.status
            ${{ runner.temp }}/prime-build.log
            ${{ runner.temp }}/prime-build.status
            ${{ runner.temp }}/prime-smoke.log
            ${{ runner.temp }}/prime-smoke.status
          if-no-files-found: warn

      - name: Enforce compatibility lane
        if: always()
        run: |
          coverage=$(cat "$RUNNER_TEMP/prime-coverage.status" 2>/dev/null || echo 126)
          build=$(cat "$RUNNER_TEMP/prime-build.status" 2>/dev/null || echo 126)
          smoke=$(cat "$RUNNER_TEMP/prime-smoke.status" 2>/dev/null || echo 126)
          echo "Prime Agent compatibility status: coverage=$coverage build=$build smoke=$smoke"
          if [ "$coverage" -ne 0 ] || [ "$build" -ne 0 ] || [ "$smoke" -ne 0 ]; then
            echo "Prime Agent is not fully compatible with ScriptC yet."
            echo "--- smoke tail ---"
            tail -n 120 "$RUNNER_TEMP/prime-smoke.log" 2>/dev/null || true
            echo "--- build tail ---"
            tail -n 120 "$RUNNER_TEMP/prime-build.log" 2>/dev/null || true
            echo "--- coverage tail ---"
            tail -n 120 "$RUNNER_TEMP/prime-coverage.log" 2>/dev/null || true
            exit 1
          fi
