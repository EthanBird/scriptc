name: Prime Agent compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - agent/prime-compat-phase1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prime-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout scriptc
        uses: actions/checkout@v4

      - name: Checkout Prime Agent oracle
        uses: actions/checkout@v4
        with:
          repository: EthanBird/prime-agent
          ref: main
          path: .compat/prime-agent

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install scriptc
        run: pnpm install --frozen-lockfile

      - name: Build scriptc
        run: pnpm build

      - name: Install Prime Agent
        working-directory: .compat/prime-agent
        run: npm ci

      - name: ScriptC coverage of Prime Agent CLI
        id: coverage
        working-directory: .compat/prime-agent
        continue-on-error: true
        run: |
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" \
            coverage packages/coding-agent/src/cli-main.ts \
            --dynamic 2>&1 | tee "$RUNNER_TEMP/prime-coverage.log"

      - name: ScriptC build of Prime Agent CLI
        id: build
        working-directory: .compat/prime-agent
        continue-on-error: true
        run: |
          set -o pipefail
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" \
            build packages/coding-agent/src/cli-main.ts \
            --dynamic \
            -o "$RUNNER_TEMP/prime-agent-scriptc" 2>&1 | tee "$RUNNER_TEMP/prime-build.log"

      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-agent-scriptc-diagnostics
          path: |
            ${{ runner.temp }}/prime-coverage.log
            ${{ runner.temp }}/prime-build.log
          if-no-files-found: warn

      - name: Enforce compatibility lane
        if: steps.coverage.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "Prime Agent is not fully compatible with ScriptC yet."
          echo "coverage outcome: ${{ steps.coverage.outcome }}"
          echo "build outcome:    ${{ steps.build.outcome }}"
          exit 1
