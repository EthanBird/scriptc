name: Agent compatibility fast lane

on:
  push:
    branches:
      - agent/prime-compat-phase1

concurrency:
  group: agent-fast-lane-prime-compat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EthanBird/scriptc
          ref: agent/prime-compat-phase1
          fetch-depth: 0

      - name: Claim staged task first
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .agent/next.py ]; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            echo "No staged compiler task."
            exit 0
          fi
          cp .agent/next.py /tmp/scriptc-next.py
          rm .agent/next.py
          git config user.name "scriptc-compat-bot"
          git config user.email "scriptc-compat-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Claim staged compatibility task"
          git push origin HEAD:agent/prime-compat-phase1
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.claim.outputs.claimed == 'true'
        with:
          node-version: '24.15.0'

      - name: Enable pnpm
        if: steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          node --version
          pnpm --version

      - name: Install compiler dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Execute claimed task
        id: execute
        if: steps.claim.outputs.claimed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          python3 /tmp/scriptc-next.py 2>&1 | tee /tmp/scriptc-fast-lane.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish validated result
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            if [ "${{ steps.execute.outcome }}" != "success" ]; then
              {
                echo "claimed compatibility task exited nonzero before producing tracked diagnostics"
                echo "execute outcome: ${{ steps.execute.outcome }}"
                echo "execute status: ${{ steps.execute.outputs.status }}"
                echo "claim commit: $(git rev-parse HEAD)"
                echo "--- task log tail ---"
                tail -n 240 /tmp/scriptc-fast-lane.log 2>/dev/null || true
              } > FAST_LANE_EXECUTION_FAILURE.txt
              git add FAST_LANE_EXECUTION_FAILURE.txt
            else
              echo "Task produced no tracked result."
              exit 0
            fi
          fi
          git commit -m "Advance Prime Agent compatibility"
          # A diagnostic/oracle commit may have landed while this task was
          # executing. Rebase the validated result instead of overwriting it;
          # a real source conflict fails loudly and leaves the branch intact.
          git pull --rebase origin agent/prime-compat-phase1
          git push origin HEAD:agent/prime-compat-phase1

      - name: Enforce task execution
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          test "${{ steps.execute.outcome }}" = success
